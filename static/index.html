<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Báo Cáo GDP — WorldRP</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Be+Vietnam+Pro:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:        #050a0f;
    --bg2:       #0a1520;
    --bg3:       #0d1e2e;
    --card:      #0f2236;
    --card-h:    #132840;
    --border:    #1a3a55;
    --cyan:      #00e5ff;
    --green:     #00ff88;
    --green2:    #00cc6a;
    --yellow:    #ffd700;
    --red:       #ff4444;
    --text:      #c8dce8;
    --text2:     #7a9ab0;
    --glow-c:    0 0 20px rgba(0,229,255,0.3);
    --glow-g:    0 0 20px rgba(0,255,136,0.4);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Be Vietnam Pro', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── GRID BG ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── SCAN LINE ── */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.05) 2px,
      rgba(0,0,0,0.05) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 20px 60px;
    position: relative;
    z-index: 1;
  }

  /* ── HEADER ── */
  header { text-align: center; margin-bottom: 40px; }

  .title-wrap {
    display: inline-block;
    position: relative;
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.4rem, 4vw, 2.4rem);
    font-weight: 900;
    letter-spacing: 0.1em;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--green) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 12px rgba(0,229,255,0.5));
    animation: title-glow 3s ease-in-out infinite;
  }

  @keyframes title-glow {
    0%,100% { filter: drop-shadow(0 0 8px rgba(0,229,255,0.4)); }
    50%      { filter: drop-shadow(0 0 20px rgba(0,229,255,0.8)); }
  }

  .subtitle {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    color: var(--text2);
    margin-top: 8px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .world-date {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.9rem;
    color: var(--cyan);
    margin-top: 6px;
    letter-spacing: 0.15em;
  }

  /* ── DECORATIVE LINE ── */
  .deco-line {
    display: flex; align-items: center; gap: 12px;
    margin: 20px auto; max-width: 600px;
  }
  .deco-line::before, .deco-line::after {
    content: ''; flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  }
  .deco-line span {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    color: var(--cyan);
    letter-spacing: 0.3em;
  }

  /* ── STATS BAR ── */
  .stats-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .stat-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 16px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stat-chip .val {
    color: var(--green);
    font-weight: 700;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.7); }
  }

  /* ── TABLE HEADER ── */
  .table-header {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    padding: 8px 20px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--text2);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  /* ── COUNTRY CARD ── */
  .country-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .country-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 16px;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
    animation: card-in 0.4s ease both;
  }

  .country-card:nth-child(1) { animation-delay: 0.05s; }
  .country-card:nth-child(2) { animation-delay: 0.10s; }
  .country-card:nth-child(3) { animation-delay: 0.15s; }
  .country-card:nth-child(4) { animation-delay: 0.20s; }
  .country-card:nth-child(5) { animation-delay: 0.25s; }
  .country-card:nth-child(6) { animation-delay: 0.30s; }

  @keyframes card-in {
    from { opacity:0; transform: translateY(12px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .country-card::before {
    content: '';
    position: absolute; left:0; top:0; bottom:0;
    width: 3px;
    background: var(--border);
    transition: background 0.2s;
  }

  .country-card:hover {
    background: var(--card-h);
    border-color: rgba(0,229,255,0.3);
    transform: translateX(4px);
  }

  .country-card:hover::before {
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
  }

  /* Rank badge */
  .rank {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    text-align: center;
    color: var(--text2);
  }

  .rank.top1 { color: var(--yellow); text-shadow: 0 0 10px rgba(255,215,0,0.6); }
  .rank.top2 { color: #c0c0c0; text-shadow: 0 0 8px rgba(192,192,192,0.5); }
  .rank.top3 { color: #cd7f32; text-shadow: 0 0 8px rgba(205,127,50,0.5); }

  /* Flag + name */
  .country-info { display: flex; align-items: center; gap: 14px; min-width: 0; }

  .flag {
    width: 48px; height: 32px;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg3);
  }

  .flag-placeholder {
    width: 48px; height: 32px;
    border-radius: 4px;
    background: var(--bg3);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem;
    color: var(--text2);
    flex-shrink: 0;
  }

  .country-name {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .growth-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: var(--green2);
    margin-top: 2px;
  }

  /* GDP value */
  .gdp-block { text-align: right; }

  .gdp-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 12px rgba(0,255,136,0.4);
    letter-spacing: 0.05em;
    line-height: 1;
  }

  .gdp-value.flash {
    animation: num-flash 0.15s ease;
  }

  @keyframes num-flash {
    0%   { color: var(--cyan); text-shadow: 0 0 20px var(--cyan); }
    100% { color: var(--green); text-shadow: 0 0 12px rgba(0,255,136,0.4); }
  }

  .gdp-unit {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    color: var(--text2);
    margin-top: 3px;
    letter-spacing: 0.1em;
  }

  /* ── TOP 1 SPECIAL ── */
  .country-card.first-place {
    background: linear-gradient(135deg, #0f2236 0%, #0d2035 60%, #102030 100%);
    border-color: rgba(255,215,0,0.2);
  }

  .country-card.first-place::before {
    background: var(--yellow);
    box-shadow: 0 0 12px rgba(255,215,0,0.6);
  }

  .country-card.first-place .gdp-value {
    color: var(--yellow);
    text-shadow: 0 0 16px rgba(255,215,0,0.5);
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    margin-top: 40px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    color: var(--text2);
    letter-spacing: 0.15em;
    opacity: 0.6;
  }

  /* ── LOADING ── */
  .loading {
    text-align: center;
    padding: 80px 0;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9rem;
    color: var(--cyan);
    letter-spacing: 0.3em;
    animation: title-glow 1.5s ease-in-out infinite;
  }

  /* ── ADMIN PANEL ── */
  .admin-btn {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 1.1rem;
    color: var(--text2);
    z-index: 100;
    transition: all 0.2s;
  }
  .admin-btn:hover { border-color: var(--cyan); color: var(--cyan); }

  .admin-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .admin-overlay.open { display: flex; }

  .admin-modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 480px;
    position: relative;
    animation: card-in 0.25s ease;
  }

  .admin-modal h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1rem;
    color: var(--cyan);
    letter-spacing: 0.15em;
    margin-bottom: 20px;
  }

  .admin-close {
    position: absolute; top: 16px; right: 16px;
    background: none; border: none;
    color: var(--text2); font-size: 1.2rem;
    cursor: pointer;
    transition: color 0.2s;
  }
  .admin-close:hover { color: var(--red); }

  .form-group {
    margin-bottom: 14px;
  }

  .form-group label {
    display: block;
    font-size: 0.75rem;
    color: var(--text2);
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    font-family: 'Share Tech Mono', monospace;
  }

  .form-group input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 14px;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--cyan); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn-submit {
    width: 100%;
    margin-top: 6px;
    background: linear-gradient(135deg, #004d66, #006644);
    border: 1px solid var(--cyan);
    border-radius: 6px;
    padding: 10px;
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-submit:hover { background: linear-gradient(135deg, #006688, #008855); }

  .btn-delete {
    width: 100%;
    margin-top: 8px;
    background: rgba(255,68,68,0.1);
    border: 1px solid rgba(255,68,68,0.3);
    border-radius: 6px;
    padding: 10px;
    color: var(--red);
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-delete:hover { background: rgba(255,68,68,0.2); }

  .admin-tabs {
    display: flex; gap: 8px;
    margin-bottom: 18px;
  }
  .tab-btn {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px;
    color: var(--text2);
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active { border-color: var(--cyan); color: var(--cyan); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .msg {
    margin-top: 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    text-align: center;
    min-height: 20px;
  }
  .msg.ok  { color: var(--green); }
  .msg.err { color: var(--red); }

  .login-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 300;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
  }
  .login-overlay.open { display: flex; }
  .login-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%; max-width: 340px;
    text-align: center;
    animation: card-in 0.25s ease;
  }
  .login-box h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9rem;
    color: var(--cyan);
    letter-spacing: 0.2em;
    margin-bottom: 20px;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>BÁO CÁO GDP THỜI GIAN THỰC</h1>
    <p class="subtitle">Real-Time GDP Report — WorldRP</p>
    <p class="world-date" id="worldDate">LỊCH WORLD: --/--/----</p>
    <div class="deco-line"><span>◈</span></div>
  </header>

  <div class="stats-bar">
    <div class="stat-chip">
      <div class="dot"></div>
      LIVE &nbsp;<span class="val" id="countryCount">--</span> QUỐC GIA
    </div>
    <div class="stat-chip">
      ⏱ CẬP NHẬT MỖI GIÂY
    </div>
    <div class="stat-chip">
      📡 SERVER <span class="val">ONLINE</span>
    </div>
  </div>

  <div class="table-header">
    <span>#</span>
    <span>QUỐC GIA</span>
    <span>GDP (USD)</span>
  </div>

  <div class="country-list" id="countryList">
    <div class="loading">ĐANG TẢI DỮ LIỆU...</div>
  </div>

  <footer>
    WorldRP 1960s &nbsp;|&nbsp; GDP TRACKER v1.0 &nbsp;|&nbsp; DATA POWERED BY MONGODB
  </footer>

</div>

<script>
// ── STATE ──
let countries = [];
let serverTime = 0;
let localTime  = 0;
let prevGdp    = {};

// ── FETCH từ server mỗi 5 giây ──
async function fetchGDP() {
  try {
    const res  = await fetch('/api/gdp');
    const data = await res.json();

    serverTime = data.server_time;
    localTime  = performance.now() / 1000;
    countries  = data.countries;

    document.getElementById('worldDate').textContent =
      'LỊCH WORLD: ' + data.world_date;
    document.getElementById('countryCount').textContent =
      data.countries.length;

  } catch(e) {
    console.error('Fetch error:', e);
  }
}

// ── TÍNH GDP HIỆN TẠI dựa theo elapsed time ──
function calcLocalGDP(c) {
  if (!serverTime) return c.gdp;
  const elapsed    = (performance.now() / 1000 - localTime);
  const perSecond  = c.gdp_base * c.growth_rate / (365 * 24 * 3600);
  return c.gdp + elapsed * perSecond;
}

// ── FORMAT SỐ: 1.234.567.890,123 ──
function fmtGDP(n) {
  const intPart  = Math.floor(n);
  const fracPart = (n - intPart).toFixed(3).slice(2); // 3 chữ số
  const intFmt   = intPart.toLocaleString('de-DE');   // dùng . làm sep
  return intFmt + ',' + fracPart;
}

// ── RENDER danh sách ──
function render() {
  if (!countries.length) return;

  const sorted = [...countries].sort((a,b) => calcLocalGDP(b) - calcLocalGDP(a));
  const list   = document.getElementById('countryList');

  sorted.forEach((c, i) => {
    const gdp     = calcLocalGDP(c);
    const gdpStr  = fmtGDP(gdp);
    const rankCls = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
    const cardCls = i === 0 ? 'country-card first-place' : 'country-card';

    let el = document.getElementById('card-' + c.id);

    if (!el) {
      // Tạo mới
      el = document.createElement('div');
      el.id        = 'card-' + c.id;
      el.className = cardCls;
      el.innerHTML = `
        <div class="rank ${rankCls}">#${i+1}</div>
        <div class="country-info">
          ${c.flag
            ? `<img class="flag" src="${c.flag}" alt="${c.name}" onerror="this.outerHTML='<div class=\\"flag-placeholder\\">N/A</div>'">`
            : `<div class="flag-placeholder">N/A</div>`
          }
          <div>
            <div class="country-name">${c.name}</div>
            <div class="growth-badge">▲ ${(c.growth_rate*100).toFixed(1)}%/năm</div>
          </div>
        </div>
        <div class="gdp-block">
          <div class="gdp-value" id="gdp-${c.id}">${gdpStr}</div>
          <div class="gdp-unit">USD</div>
        </div>
      `;
      list.appendChild(el);
    } else {
      // Cập nhật số
      const gdpEl = document.getElementById('gdp-' + c.id);
      if (gdpEl && gdpStr !== prevGdp[c.id]) {
        gdpEl.textContent = gdpStr;
        gdpEl.classList.remove('flash');
        void gdpEl.offsetWidth; // reflow
        gdpEl.classList.add('flash');
      }

      // Cập nhật rank
      const rankEl = el.querySelector('.rank');
      if (rankEl) {
        rankEl.textContent = '#' + (i+1);
        rankEl.className   = 'rank ' + rankCls;
      }

      // Cập nhật class card
      el.className = cardCls;
    }

    prevGdp[c.id] = gdpStr;
  });

  // Sắp xếp lại DOM theo thứ tự
  sorted.forEach(c => {
    const el = document.getElementById('card-' + c.id);
    if (el) list.appendChild(el);
  });

  // Xóa loading nếu còn
  const loading = list.querySelector('.loading');
  if (loading) loading.remove();
}

// ── ANIMATION LOOP ~60fps ──
function loop() {
  render();
  requestAnimationFrame(loop);
}

// ── INIT ──
(async () => {
  await fetchGDP();
  setInterval(fetchGDP, 5000);
  loop();
})();

<button class="admin-btn" onclick="openAdmin()" title="Admin Panel">⚙</button>

<!-- ── LOGIN OVERLAY ── -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>🔐 ADMIN LOGIN</h2>
    <div class="form-group">
      <label>PASSWORD</label>
      <input type="password" id="loginPw" placeholder="Nhập mật khẩu..." onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="btn-submit" onclick="doLogin()">ĐĂNG NHẬP</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<!-- ── ADMIN MODAL ── -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-modal">
    <h2>⚙ ADMIN PANEL</h2>
    <button class="admin-close" onclick="closeAdmin()">✕</button>

    <div class="admin-tabs">
      <button class="tab-btn active" onclick="switchTab('add')">➕ THÊM / SỬA</button>
      <button class="tab-btn" onclick="switchTab('del')">🗑 XÓA</button>
      <button class="tab-btn" onclick="switchTab('sync')">💾 SYNC</button>
    </div>

    <!-- TAB: THÊM / SỬA -->
    <div class="tab-content active" id="tab-add">
      <div class="form-group">
        <label>ID (không dấu, không khoảng trắng)</label>
        <input type="text" id="f-id" placeholder="vd: hong_duong"/>
      </div>
      <div class="form-group">
        <label>TÊN QUỐC GIA</label>
        <input type="text" id="f-name" placeholder="vd: Hồng Dương"/>
      </div>
      <div class="form-group">
        <label>URL CỜ (tùy chọn)</label>
        <input type="text" id="f-flag" placeholder="https://flagcdn.com/w80/vn.png"/>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>GDP HIỆN TẠI (USD)</label>
          <input type="number" id="f-gdp" placeholder="vd: 5694000000000"/>
        </div>
        <div class="form-group">
          <label>TĂNG TRƯỞNG (%/năm)</label>
          <input type="number" id="f-growth" placeholder="vd: 5" step="0.1"/>
        </div>
      </div>
      <button class="btn-submit" onclick="submitCountry()">✅ LƯU QUỐC GIA</button>
      <div class="msg" id="addMsg"></div>
    </div>

    <!-- TAB: XÓA -->
    <div class="tab-content" id="tab-del">
      <div class="form-group">
        <label>ID QUỐC GIA CẦN XÓA</label>
        <input type="text" id="f-del-id" placeholder="vd: hong_duong"/>
      </div>
      <button class="btn-delete" onclick="deleteCountry()">🗑 XÓA QUỐC GIA</button>
      <div class="msg" id="delMsg"></div>
    </div>

    <!-- TAB: SYNC -->
    <div class="tab-content" id="tab-sync">
      <p style="font-size:0.8rem;color:var(--text2);margin-bottom:16px;line-height:1.6">
        Sync sẽ lưu GDP hiện tại vào database.<br>
        Nên bấm trước khi restart server để không mất dữ liệu.
      </p>
      <button class="btn-submit" onclick="syncGDP()">💾 SYNC GDP VÀO DATABASE</button>
      <div class="msg" id="syncMsg"></div>
    </div>
  </div>
</div>

<script>
const ADMIN_KEY = 'hongson112233';
let adminUnlocked = false;

function openAdmin() {
  if (!adminUnlocked) {
    document.getElementById('loginOverlay').classList.add('open');
    document.getElementById('loginPw').focus();
  } else {
    document.getElementById('adminOverlay').classList.add('open');
  }
}

function doLogin() {
  const pw = document.getElementById('loginPw').value;
  if (pw === ADMIN_KEY) {
    adminUnlocked = true;
    document.getElementById('loginOverlay').classList.remove('open');
    document.getElementById('loginPw').value = '';
    document.getElementById('adminOverlay').classList.add('open');
    document.getElementById('loginMsg').textContent = '';
  } else {
    document.getElementById('loginMsg').textContent = '❌ Sai mật khẩu!';
    document.getElementById('loginMsg').className = 'msg err';
  }
}

function closeAdmin() {
  document.getElementById('adminOverlay').classList.remove('open');
}

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['add','del','sync'][i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

async function submitCountry() {
  const id     = document.getElementById('f-id').value.trim();
  const name   = document.getElementById('f-name').value.trim();
  const flag   = document.getElementById('f-flag').value.trim();
  const gdp    = parseFloat(document.getElementById('f-gdp').value);
  const growth = parseFloat(document.getElementById('f-growth').value) / 100;
  const msg    = document.getElementById('addMsg');

  if (!id || !name || isNaN(gdp) || isNaN(growth)) {
    msg.textContent = '❌ Vui lòng điền đủ thông tin!';
    msg.className = 'msg err'; return;
  }

  msg.textContent = '⏳ Đang lưu...'; msg.className = 'msg';
  try {
    const res = await fetch('/api/country', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': ADMIN_KEY },
      body: JSON.stringify({ id, name, flag, gdp_base: gdp, growth_rate: growth })
    });
    const data = await res.json();
    if (data.success) {
      msg.textContent = '✅ Đã lưu thành công!';
      msg.className = 'msg ok';
    } else {
      msg.textContent = '❌ ' + (data.error || 'Lỗi!');
      msg.className = 'msg err';
    }
  } catch(e) {
    msg.textContent = '❌ Lỗi kết nối!'; msg.className = 'msg err';
  }
}

async function deleteCountry() {
  const id  = document.getElementById('f-del-id').value.trim();
  const msg = document.getElementById('delMsg');
  if (!id) { msg.textContent = '❌ Nhập ID!'; msg.className = 'msg err'; return; }
  if (!confirm(`Xóa quốc gia "${id}"?`)) return;

  msg.textContent = '⏳ Đang xóa...'; msg.className = 'msg';
  try {
    const res = await fetch('/api/country/' + id, {
      method: 'DELETE',
      headers: { 'X-Admin-Key': ADMIN_KEY }
    });
    const data = await res.json();
    if (data.success) { msg.textContent = '✅ Đã xóa!'; msg.className = 'msg ok'; }
    else { msg.textContent = '❌ ' + (data.error || 'Lỗi!'); msg.className = 'msg err'; }
  } catch(e) {
    msg.textContent = '❌ Lỗi kết nối!'; msg.className = 'msg err';
  }
}

async function syncGDP() {
  const msg = document.getElementById('syncMsg');
  msg.textContent = '⏳ Đang sync...'; msg.className = 'msg';
  try {
    const res = await fetch('/api/sync', {
      method: 'POST',
      headers: { 'X-Admin-Key': ADMIN_KEY }
    });
    const data = await res.json();
    if (data.success) {
      msg.textContent = `✅ Đã sync ${data.synced} quốc gia!`;
      msg.className = 'msg ok';
    }
  } catch(e) {
    msg.textContent = '❌ Lỗi!'; msg.className = 'msg err';
  }
}

// Đóng modal khi click ngoài
document.getElementById('adminOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeAdmin();
});
document.getElementById('loginOverlay').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});
</script>
</body>
</html>
